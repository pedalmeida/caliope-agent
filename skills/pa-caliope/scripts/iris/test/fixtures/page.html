<!doctype html>
<html lang="pt-PT">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Página de teste do screenshot.mjs</title>
<style>
  :root { --bg: #ffffff; --fg: #111827; --accent: #2563eb; color-scheme: light dark; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0b1220; --fg: #e5e7eb; --accent: #7ba3f2; } }
  body { margin: 0; font: 16px/1.5 system-ui, sans-serif; background: var(--bg); color: var(--fg); }
  header { padding: 24px; border-bottom: 1px solid color-mix(in oklab, var(--fg) 15%, transparent); }
  h1 { margin: 0; font-size: clamp(1.5rem, 1rem + 2vw, 2.5rem); }
  main { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; padding: 24px; }
  .card { border-radius: 12px; padding: 16px; background: color-mix(in oklab, var(--accent) 12%, var(--bg)); }
  .spinner { width: 40px; height: 40px; border: 4px solid var(--accent); border-right-color: transparent; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  @media (prefers-reduced-motion: reduce) { .spinner { animation: none; border-right-color: var(--accent); } .motion-label::after { content: " (movimento reduzido)"; } }
  .wide { width: 520px; height: 8px; background: var(--accent); }
  footer { padding: 24px; height: 900px; }
</style>
</head>
<body>
<header><h1>Painel de teste</h1><p class="motion-label">Estado do movimento</p></header>
<main>
  <div class="card"><div class="spinner"></div></div>
  <div class="card">Cartão 2</div>
  <div class="card">Cartão 3</div>
  <div class="card"><div class="wide"></div>Elemento com 520px fixos: transborda abaixo de ~570px.</div>
</main>
<footer>Rodapé alto para testar --full-page.</footer>
<script>console.error("erro de teste propositado");</script>
</body>
</html>
